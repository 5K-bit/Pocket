name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # build-only rehearsal; publishes nothing
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and tag check
        id: ver
        run: |
          v="$(grep -oP 'POCKET <span>\K[0-9.]+' index.html)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "v$v" = "$GITHUB_REF_NAME"; fi
          test -s "docs/releases/v$v.md"
      - name: Package runtime files
        run: |
          mkdir -p dist
          zip -X dist/obeos-pocket-v${{ steps.ver.outputs.version }}.zip index.html styles.css app.js manifest.webmanifest service-worker.js _headers netlify.toml icons/icon-192.png icons/icon-512.png
          unzip -l dist/*.zip
          cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Verify the ZIP is a complete app
        run: |
          mkdir check && unzip -q dist/*.zip -d check && cd check
          node --check app.js && node --check service-worker.js
          python3 - <<'PY'
          import json,re,pathlib
          m=json.load(open('manifest.webmanifest'))
          for i in m['icons']: assert pathlib.Path(i['src']).is_file(), i
          for a in re.findall(r'(?:src|href)="\./([^"#?]+)"', open('index.html').read()): assert pathlib.Path(a).is_file(), a
          PY
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/* }
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
